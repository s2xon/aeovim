[package]
name = "aeovim"
version = "0.0.1"
edition = "2021"
description = "aeovim — a modal TUI for orchestrating coding agents (walking skeleton). Binary: avim."
license = "MIT"

# The project is `aeovim`; the command is `avim` (Neovim -> nvim).
[[bin]]
name = "avim"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
# unstable-rendered-line-info gives Paragraph::line_count for wrap-accurate scroll math.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
# PTY + VT-emulation smoke tests: drive the real binary in a pseudo-terminal and
# assert on the parsed screen (catches escape/mode regressions unit tests can't).
portable-pty = "0.8"
vt100 = "0.15"

[profile.release]
opt-level = 2
